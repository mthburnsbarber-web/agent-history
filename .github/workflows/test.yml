name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships Python 3.9 as /usr/bin/python3, so 3.9 is tested there.
          # GitHub's current Ubuntu image has no 3.9 build; 3.10 is its oldest.
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Install as a command and run it
        run: |
          python -m pip install .
          agent-history --version
